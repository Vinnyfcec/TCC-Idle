<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochileiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div>
  <header class="header">
    <h1 class="game-title">Mochileiro</h1>

    <div class="gold-hud">
      <!-- simbolo ou icone -->
      <div>
        <div class="gold-hud-label">Gold:</div>
        <div id="gold-display">1000</div> <!-- alteravel em display -->
      </div>
    </div>
  </header>

  <div class="main">
    <div class="inventory">
      <div class="inventory-header">
        <span class="inventory-title">Inventário</span>
        <span class="inventory-count" id="slot-count">0 / 20</span>
      </div>

      <div class="inventory-body">
        <div id="inventory-grid"></div><!-- inventario de fato -->
      </div>
    </div>

    <div class="loja">
      <div class="loja-header">
        <span class="loja-title">Loja</span>
      </div>

      <div class="loja-body">
        <div id="loja-list"></div><!-- estoque -->
      </div>

      <!-- obviamente temporario -->
      <form id="addItem">
        <input type="text" id="item-name" placeholder="nome" required>
        <input type="number" id="item-price" placeholder="preço" required>
        <input type="number" id="item-quantity" placeholder="quantidade" required>
        <input type="checkbox" id="item-stackable"> Stackable
        <button type="submit">Adicionar Item</button>
      </form>
    </div>

  </div>
</div>

<script src="js/data/items.js"></script>
<script src="js/inventory.js"></script>
<script src="js/shop.js"></script>
<script src="js/ui/UI.js"></script>
<script src="js/main.js"></script>

</body>
</html>
