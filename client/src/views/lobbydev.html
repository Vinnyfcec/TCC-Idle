<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>LOBBY DEV</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <a href="index.html"> INDEX.HTML </a>
    <a href="combat.html"> COMBAT.HTML </a>
    <button id="clear-storage-btn">Limpar localStorage</button>

    <script>
        (function(){
            const GAME_KEYS = ['game_inventory','game_gold','game_shop'];
            const btn = document.getElementById('clear-storage-btn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                if (!confirm('Apagar o localStorage?')) return;
                try {
                    GAME_KEYS.forEach(k => localStorage.removeItem(k));
                    location.reload();
                } catch (e) {
                    console.error('Erro ao limpar localStorage', e);
                }
            });
        })();
    </script>
</body>
</html>
