<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochileiro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="home">
  <header class="header">
    <h1 class="game-title">Mochileiro</h1>
    <div class="gold-hud">
      <div>
        <div class="gold-hud-label">Ouro:</div>
        <div id="gold-display">1000</div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="inventory">
      <div class="inventory-header">
        <span class="inventory-title">Inventário</span>
        <span class="inventory-count" id="slot-count">0 / 20</span>
      </div>
      <div class="inventory-body">
        <div id="inventory-grid"></div>
      </div>
    </section>

    <section class="combat-section">
      <div id="game-screen"></div>
      <div id="player-box"></div>
      <div id="enemy-box"></div>
      <button id="start-mission-btn" type="button">Iniciar missão</button>
    </section>

    <section class="shop">
      <div class="shop-header">
        <span class="shop-title">Loja</span>
      </div>
      <div class="shop-body">
        <div id="shop-list"></div>
      </div>
    </section>
  </main>

  <script src="../js/data/items.js"></script>
  <script src="../js/inventory.js"></script>
  <script src="../js/shop.js"></script>
  <script src="../js/combat.js"></script>
  <script src="../js/ui/UI.js"></script>
  <script src="../js/ui/UIinventory.js"></script>
  <script src="../js/ui/UIcombat.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
