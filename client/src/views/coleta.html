<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coleta de madeira - Mochileiro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="collection">
  <main class="resource-page">
    <h1>Coleta de recursos</h1>
    <p class="resource-balance">
      Madeira armazenada: <span id="wood-count">0</span>
      <span aria-hidden="true">|</span>
      Ouro: <span id="gold-display">1000</span>
    </p>
    <button id="collect-wood-btn" type="button">Coletar madeira</button>
    <button id="back-to-lobby-btn" type="button">Voltar para a vila</button>
  </main>

  <script src="../js/ui/UI.js"></script>
  <script src="../js/resources.js"></script>
  <script src="../js/ui/UIresources.js"></script>
</body>
</html>
