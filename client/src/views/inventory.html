<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="inventory">
  <header class="header">
    <h1 class="game-title">Inventário</h1>
    <div class="gold-hud">
      <div>
        <div>Dia <strong id="day-number">1</strong></div>
        <div hidden>Próximo dia <strong id="day-timer">05:00</strong></div>
        <div class="gold-hud-label">Ouro: <span id="gold-display">200</span></div>
      </div>
    </div>
  </header>

  <main class="main">
    <button id="back-to-village-btn" type="button">Voltar para a vila</button>
    <section class="inventory">
      <div class="inventory-header">
        <span class="inventory-title">Inventário</span>
        <span class="inventory-count" id="slot-count">0 / 25</span>
      </div>
      <div class="inventory-body">
        <div id="inventory-grid"></div>
      </div>
    </section>
  </main>

  <script src="../js/data/items.js"></script>
  <script src="../js/inventory.js"></script>
  <script src="../js/shop.js"></script>
  <script src="../js/resources.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/ui/UI.js"></script>
  <script src="../js/ui/UIinventory.js"></script>
  <script src="../js/ui/UIDemo.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
