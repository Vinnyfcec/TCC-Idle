<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja — Mochileiro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="shop" class="shop-scene-page">
  <header class="scene-hud">
    <button class="scene-logo scene-title-button" type="button" aria-label="Voltar ao título">Mochileiro</button>
    <div class="world-hud">
      <span>Dia <strong id="day-number">1</strong></span>
      <span hidden>Próximo dia <strong id="day-timer">05:00</strong></span>
      <span>Ouro <strong id="gold-display">200</strong></span>
    </div>
    <span class="hud-icon-spacer" aria-hidden="true"></span>
  </header>

  <section id="title-return-dialog" class="title-return-dialog" role="dialog" aria-modal="true" aria-labelledby="title-return-question" hidden>
    <div class="title-return-panel">
      <h2 id="title-return-question">Quer voltar ao título?</h2>
      <div class="title-return-actions">
        <button class="title-return-yes" type="button">Sim</button>
        <button class="title-return-no" type="button">Não</button>
      </div>
    </div>
  </section>

  <main class="shop-scene">
    <button id="sell-items-btn" class="shop-sell-button" type="button">
      Vender itens
    </button>
    <button id="shop-to-guild-btn" class="scene-arrow scene-arrow-left" type="button" aria-label="Voltar para o quadro da guilda">
      <span aria-hidden="true">←</span>
      <span>Quadro de missões</span>
    </button>
    <section class="shop-counter" aria-labelledby="shop-title">
      <img class="shop-counter-art" src="../../assets/aaa/bancada%20loja.png" alt="" aria-hidden="true">
      <div class="shop-counter-heading">
        <p class="eyebrow">Capital · rua principal</p>
        <h1 id="shop-title">Loja</h1>
      </div>
      <div class="shop-body">
        <div id="shop-list"></div>
      </div>
    </section>
    <button id="shop-to-village-btn" class="scene-arrow scene-arrow-right" type="button" aria-label="Voltar para a vila">
      <span>Voltar para a vila</span>
      <span aria-hidden="true">→</span>
    </button>
  </main>

  <script src="../js/data/items.js"></script>
  <script src="../js/inventory.js"></script>
  <script src="../js/shop.js"></script>
  <script src="../js/resources.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/ui/UI.js"></script>
  <script src="../js/ui/UIDemo.js"></script>
  <script src="../js/saveManager.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
