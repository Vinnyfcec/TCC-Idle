<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vila - Mochileiro</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-page="lobby">
  <main class="resource-page">
    <h1>Vila</h1>
    <p class="resource-balance">
      Madeira: <span id="wood-count">0</span>
      <span aria-hidden="true">|</span>
      Ouro: <span id="gold-display">1000</span>
    </p>

    <nav class="resource-actions" aria-label="Mecânicas da vila">
      <button id="start-mission-btn" type="button">Iniciar missão</button>
      <button id="inventory-btn" type="button">Inventário</button>
      <button id="shop-btn" type="button">Loja</button>
      <button id="collect-wood-nav-btn" type="button">Coletar madeira</button>
      <span class="resource-action">
        <button id="rebuild-btn" type="button" disabled aria-describedby="rebuild-requirement">
          Reconstruir cabana e carroça
        </button>
        <span id="rebuild-requirement" class="resource-tooltip" aria-live="polite">Madeira: 0/50</span>
        <span id="house-obtained" hidden>Casa obtida</span>
      </span>
    </nav>

    <button id="clear-storage-btn" type="button">Limpar dados locais</button>
  </main>

  <script src="../src/js/ui/UI.js"></script>
  <script src="../src/js/resources.js"></script>
  <script src="../src/js/ui/UIresources.js"></script>
</body>
</html>
