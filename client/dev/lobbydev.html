<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mochileiro — Vila</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-page="lobby" class="scene-page village-page">
  <header class="scene-hud">
    <span class="scene-logo">Mochileiro</span>
    <div class="world-hud">
      <span>Dia <strong id="day-number">1</strong></span>
      <span hidden>Próximo dia <strong id="day-timer">05:00</strong></span>
      <span>Ouro <strong id="gold-display">200</strong></span>
      <span>Madeira <strong id="wood-count">0</strong></span>
    </div>
    <button id="inventory-btn" class="hud-icon-button" type="button" aria-label="Abrir inventário" title="Inventário">▦</button>
  </header>

  <main class="village-world">
    <div class="scene-sky village-forest-sky" aria-hidden="true"></div>
    <div class="village-forest-back" aria-hidden="true"></div>
    <div class="village-pines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="village-forest-front" aria-hidden="true"></div>
    <div class="village-path" aria-hidden="true"></div>

    <button id="capital-gate" class="village-exit village-exit-left" type="button" aria-label="Ir para a capital">
      <span class="village-exit-arrow" aria-hidden="true">←</span>
      <span class="village-exit-label">Ir para a capital</span>
    </button>

    <button id="forest-gate" class="village-exit village-exit-right" type="button" aria-label="Ir para a coleta" disabled>
      <span class="village-exit-arrow" aria-hidden="true">→</span>
      <span class="village-exit-label">Ir para a coleta</span>
    </button>

    <div class="village-settlements" aria-label="Vilas destruídas ao longo da floresta">
      <div class="village-ruin village-ruin-1" aria-hidden="true"><img class="ruined-village-sprite" src="../assets/backgrounds/destroços.png" alt=""></div>
      <div class="village-ruin village-ruin-2" aria-hidden="true"><img class="ruined-village-sprite" src="../assets/backgrounds/destroços.png" alt=""></div>
      <div class="village-ruin village-ruin-3" aria-hidden="true"><img class="ruined-village-sprite" src="../assets/backgrounds/destroços.png" alt=""></div>
      <div class="village-ruin village-ruin-4" aria-hidden="true"><img class="ruined-village-sprite" src="../assets/backgrounds/destroços.png" alt=""></div>
      <div class="village-ruin village-ruin-5" aria-hidden="true"><img class="ruined-village-sprite" src="../assets/backgrounds/destroços.png" alt=""></div>

      <div class="merchant-landmark village-merchant-site">
        <button id="rebuild-btn" class="scene-hotspot merchant-ruins" type="button" disabled aria-describedby="rebuild-requirement">
          <img class="ruin-art" src="../assets/backgrounds/destroços.png" alt="" aria-hidden="true">
          <span class="hotspot-label">Destroços do mercador</span>
          <span id="rebuild-requirement" class="resource-tooltip" aria-live="polite">Madeira: 0/50</span>
        </button>
        <button id="merchant-house" class="scene-hotspot merchant-house" type="button" hidden aria-label="Casa do mercador">
          <img class="house-art-scene" src="../assets/backgrounds/Cabana.png" alt="" aria-hidden="true">
          <span class="hotspot-label">Casa do mercador</span>
        </button>
        <span id="house-obtained" hidden>Casa reconstruída</span>
        <span id="merchant-rescued" hidden>Mercador resgatado.</span>
      </div>
    </div>

    <section id="village-interaction" class="scene-interaction" aria-live="polite" hidden>
      <button class="scene-close" type="button" aria-label="Fechar">×</button>
      <p id="interaction-eyebrow" class="eyebrow"></p>
      <h1 id="interaction-title"></h1>
      <p id="interaction-copy"></p>
      <p id="demo-notice" class="demo-notice" role="status" hidden></p>
      <p id="rescue-requirement" class="rescue-requirement" hidden></p>
      <button id="rescue-merchant-btn" type="button" hidden>Resgatar o mercador</button>
    </section>

    <p class="save-note scene-save-note">Protótipo local · progresso salvo neste dispositivo</p>
  </main>

  <script src="../src/js/data/items.js"></script>
  <script src="../src/js/inventory.js"></script>
  <script src="../src/js/shop.js"></script>
  <script src="../src/js/resources.js"></script>
  <script src="../src/js/demo.js"></script>
  <script src="../src/js/ui/UI.js"></script>
  <script src="../src/js/ui/UIinventory.js"></script>
  <script src="../src/js/ui/UIDemo.js"></script>
  <script src="../src/js/main.js"></script>
</body>
</html>
